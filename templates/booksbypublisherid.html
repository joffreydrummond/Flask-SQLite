<h2>Books By Publisher</h2>

<table border="1">
    <tr>
        <th>Title</th>
        <th>Year</th>
        <th>Author</th>
        <th>Publisher</th>
    </tr>

    {% for book in data %}
    <tr>
        <td>{{ book.title }}</td>
        <td>{{ book.year }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.publisher }}</td>
    </tr>
    {% endfor %}
</table>
